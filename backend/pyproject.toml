[project]
name = "video-notes-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "fastapi==0.142.2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn==0.54.0",
    "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
